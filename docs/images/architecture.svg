<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
  <title>Hospital Security — service architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Canvas background (keeps the diagram readable in GitHub dark mode) -->
  <rect x="0" y="0" width="1000" height="640" rx="16" fill="#FFFFFF"/>

  <!-- ============ Zone: user device (trusted) ============ -->
  <rect x="20" y="20" width="340" height="600" rx="14" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="40" y="50" font-size="12" font-weight="700" fill="#15803D" letter-spacing="1.2">USER DEVICE — TRUSTED</text>

  <!-- Browser card -->
  <g filter="url(#shadow)">
    <rect x="45" y="70" width="290" height="350" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <text x="65" y="102" font-size="17" font-weight="700" fill="#0F172A">Web browser</text>
  <text x="65" y="122" font-size="12" fill="#64748B">Edge · Chrome · Chromium-based</text>

  <!-- Pill: Vue SPA -->
  <rect x="65" y="140" width="250" height="68" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
  <rect x="65" y="140" width="6" height="68" rx="3" fill="#42B883"/>
  <text x="84" y="168" font-size="14" font-weight="600" fill="#0F172A">Vue.js 3 single-page app</text>
  <text x="84" y="188" font-size="12" fill="#64748B">user interface, API calls with JWT</text>

  <!-- Pill: Web Crypto -->
  <rect x="65" y="224" width="250" height="68" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
  <rect x="65" y="224" width="6" height="68" rx="3" fill="#7C3AED"/>
  <text x="84" y="252" font-size="14" font-weight="600" fill="#0F172A">Web Crypto API</text>
  <text x="84" y="272" font-size="12" fill="#64748B">all encryption and decryption</text>

  <!-- Pill: WebAuthn -->
  <rect x="65" y="308" width="250" height="68" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
  <rect x="65" y="308" width="6" height="68" rx="3" fill="#3423A6"/>
  <text x="84" y="336" font-size="14" font-weight="600" fill="#0F172A">WebAuthn client</text>
  <text x="84" y="356" font-size="12" fill="#64748B">passkey sign-in, PRF extension</text>

  <!-- Authenticator card -->
  <g filter="url(#shadow)">
    <rect x="45" y="510" width="290" height="85" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <rect x="45" y="510" width="6" height="85" rx="3" fill="#0F172A"/>
  <text x="68" y="544" font-size="15" font-weight="700" fill="#0F172A">Authenticator</text>
  <text x="68" y="566" font-size="12" fill="#64748B">Windows Hello · FIDO2 security key</text>

  <!-- Browser <-> authenticator -->
  <line x1="190" y1="424" x2="190" y2="506" stroke="#475569" stroke-width="1.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="202" y="455" font-size="12" font-weight="600" fill="#334155">PRF secret</text>
  <text x="202" y="472" font-size="11" fill="#64748B">derived on demand,</text>
  <text x="202" y="487" font-size="11" fill="#64748B">never stored</text>

  <!-- ============ Zone: server side ============ -->
  <rect x="400" y="20" width="580" height="600" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="420" y="50" font-size="12" font-weight="700" fill="#475569" letter-spacing="1.2">SERVER SIDE — DOCKER COMPOSE</text>

  <!-- frontend (nginx) -->
  <g filter="url(#shadow)">
    <rect x="490" y="70" width="230" height="90" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <rect x="490" y="70" width="6" height="90" rx="3" fill="#009639"/>
  <text x="510" y="102" font-size="15" font-weight="700" fill="#0F172A">frontend</text>
  <text x="510" y="124" font-size="12" fill="#64748B">nginx · compiled Vue app</text>
  <text x="510" y="143" font-size="12" fill="#64748B">CSP, HSTS, security headers</text>
  <rect x="660" y="84" width="48" height="22" rx="11" fill="#E2E8F0"/>
  <text x="684" y="99" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">:443</text>

  <!-- keycloak -->
  <g filter="url(#shadow)">
    <rect x="490" y="215" width="230" height="90" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <rect x="490" y="215" width="6" height="90" rx="3" fill="#008AAA"/>
  <text x="510" y="247" font-size="15" font-weight="700" fill="#0F172A">keycloak</text>
  <text x="510" y="269" font-size="12" fill="#64748B">OpenID Connect provider</text>
  <text x="510" y="288" font-size="12" fill="#64748B">passwordless flow, groups</text>
  <rect x="652" y="229" width="56" height="22" rx="11" fill="#E2E8F0"/>
  <text x="680" y="244" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">:8443</text>

  <!-- django -->
  <g filter="url(#shadow)">
    <rect x="490" y="360" width="230" height="90" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <rect x="490" y="360" width="6" height="90" rx="3" fill="#092E20"/>
  <text x="510" y="392" font-size="15" font-weight="700" fill="#0F172A">django</text>
  <text x="510" y="414" font-size="12" fill="#64748B">REST API · Gunicorn</text>
  <text x="510" y="433" font-size="12" fill="#64748B">access control, rate limiting</text>
  <rect x="652" y="374" width="56" height="22" rx="11" fill="#E2E8F0"/>
  <text x="680" y="389" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">:8000</text>

  <!-- db -->
  <g filter="url(#shadow)">
    <rect x="770" y="345" width="190" height="120" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <rect x="770" y="345" width="6" height="120" rx="3" fill="#336791"/>
  <text x="790" y="377" font-size="15" font-weight="700" fill="#0F172A">db</text>
  <text x="790" y="399" font-size="12" fill="#64748B">PostgreSQL 16</text>
  <text x="790" y="418" font-size="12" fill="#64748B">internal network only</text>
  <text x="790" y="443" font-size="11" font-style="italic" fill="#64748B">no published port</text>

  <!-- Browser -> services (cross the trust boundary) -->
  <line x1="335" y1="115" x2="486" y2="115" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="352" y="84" width="124" height="22" rx="4" fill="#FFFFFF"/>
  <text x="414" y="99" font-size="11.5" font-weight="600" fill="#334155" text-anchor="middle">HTTPS · static app</text>

  <line x1="335" y1="260" x2="486" y2="260" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="345" y="222" width="138" height="34" rx="4" fill="#FFFFFF"/>
  <text x="414" y="236" font-size="11.5" font-weight="600" fill="#334155" text-anchor="middle">HTTPS · OIDC</text>
  <text x="414" y="251" font-size="11" fill="#64748B" text-anchor="middle">passkey sign-in</text>

  <line x1="335" y1="405" x2="486" y2="405" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="345" y="367" width="138" height="34" rx="4" fill="#FFFFFF"/>
  <text x="414" y="381" font-size="11.5" font-weight="600" fill="#334155" text-anchor="middle">HTTPS · REST + JWT</text>
  <text x="414" y="396" font-size="11" fill="#64748B" text-anchor="middle">ciphertext only</text>

  <!-- django -> keycloak (JWKS) -->
  <line x1="545" y1="356" x2="545" y2="309" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="556" y="330" font-size="11.5" font-weight="600" fill="#334155">JWKS</text>
  <text x="556" y="345" font-size="11" fill="#64748B">token signature check</text>

  <!-- django -> db -->
  <line x1="720" y1="405" x2="766" y2="405" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="743" y="394" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">SQL</text>

  <!-- Key facts -->
  <rect x="420" y="495" width="540" height="105" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="440" y="523" font-size="13" font-weight="700" fill="#0F172A">The server side never sees plaintext</text>
  <circle cx="446" cy="545" r="3" fill="#22C55E"/>
  <text x="458" y="549" font-size="12" fill="#334155">Stored: encrypted blobs, wrapped keys, signed manifests</text>
  <circle cx="446" cy="566" r="3" fill="#22C55E"/>
  <text x="458" y="570" font-size="12" fill="#334155">Every connection uses HTTPS, with certificates from a local CA</text>
  <circle cx="446" cy="587" r="3" fill="#22C55E"/>
  <text x="458" y="591" font-size="12" fill="#334155">Roles come from the signed token, never from the client</text>
</svg>
