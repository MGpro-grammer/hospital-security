<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
  <title>Hospital Security — envelope encryption</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1000" height="470" rx="16" fill="#FFFFFF"/>

  <!-- Zones -->
  <rect x="20" y="24" width="560" height="340" rx="14" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="40" y="50" font-size="12" font-weight="700" fill="#15803D" letter-spacing="1.2">IN THE PATIENT'S BROWSER</text>

  <rect x="640" y="24" width="340" height="340" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="660" y="50" font-size="12" font-weight="700" fill="#475569" letter-spacing="1.2">STORED ON THE SERVER</text>

  <!-- Medical file -->
  <g filter="url(#shadow)">
    <rect x="45" y="72" width="220" height="140" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <rect x="45" y="72" width="6" height="140" rx="3" fill="#42B883"/>
  <text x="65" y="102" font-size="15" font-weight="700" fill="#0F172A">Medical file</text>
  <rect x="65" y="116" width="92" height="24" rx="12" fill="#F1F5F9"/>
  <text x="111" y="132" font-size="11.5" fill="#334155" text-anchor="middle">file name</text>
  <rect x="163" y="116" width="88" height="24" rx="12" fill="#F1F5F9"/>
  <text x="207" y="132" font-size="11.5" fill="#334155" text-anchor="middle">exam date</text>
  <rect x="65" y="146" width="92" height="24" rx="12" fill="#F1F5F9"/>
  <text x="111" y="162" font-size="11.5" fill="#334155" text-anchor="middle">content</text>
  <text x="65" y="196" font-size="11" font-style="italic" fill="#64748B">serialised together</text>

  <!-- DEK -->
  <g filter="url(#shadow)">
    <rect x="45" y="252" width="220" height="92" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <rect x="45" y="252" width="6" height="92" rx="3" fill="#7C3AED"/>
  <text x="65" y="282" font-size="15" font-weight="700" fill="#0F172A">DEK</text>
  <text x="65" y="303" font-size="12" fill="#64748B">random AES-256-GCM key</text>
  <text x="65" y="322" font-size="12" fill="#64748B">one per file</text>

  <!-- file -> blob -->
  <line x1="265" y1="142" x2="676" y2="142" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="330" y="112" width="200" height="22" rx="4" fill="#F0FDF4"/>
  <text x="430" y="127" font-size="11.5" font-weight="600" fill="#334155" text-anchor="middle">encrypt · AES-256-GCM</text>

  <!-- DEK used as the key of the encryption -->
  <path d="M265,266 C305,266 318,210 322,150" fill="none" stroke="#7C3AED" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="326" y="212" font-size="11.5" font-weight="600" fill="#6D28D9">key</text>

  <!-- DEK -> envelopes -->
  <line x1="265" y1="286" x2="676" y2="249" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="265" y1="312" x2="676" y2="319" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="420" y="260" font-size="11.5" font-weight="600" fill="#334155" text-anchor="middle">RSA-OAEP · patient's public key</text>
  <text x="420" y="338" font-size="11.5" font-weight="600" fill="#334155" text-anchor="middle">RSA-OAEP · doctor's public key</text>

  <!-- Encrypted blob -->
  <g filter="url(#shadow)">
    <rect x="680" y="92" width="275" height="100" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <rect x="680" y="92" width="6" height="100" rx="3" fill="#336791"/>
  <text x="700" y="122" font-size="15" font-weight="700" fill="#0F172A">Encrypted blob</text>
  <text x="700" y="144" font-size="12" fill="#64748B">ciphertext + 12-byte IV</text>
  <text x="700" y="172" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#94A3B8">q7Xv0Lk2c9…Zp3uR8w=</text>

  <!-- Envelope patient -->
  <g filter="url(#shadow)">
    <rect x="680" y="222" width="275" height="54" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <rect x="680" y="222" width="6" height="54" rx="3" fill="#336791"/>
  <text x="700" y="245" font-size="14" font-weight="700" fill="#0F172A">Wrapped DEK — patient</text>
  <text x="700" y="265" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#94A3B8">Hk3r9Tq0…mB4=</text>

  <!-- Envelope doctor -->
  <g filter="url(#shadow)">
    <rect x="680" y="292" width="275" height="54" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <rect x="680" y="292" width="6" height="54" rx="3" fill="#336791"/>
  <text x="700" y="315" font-size="14" font-weight="700" fill="#0F172A">Wrapped DEK — doctor</text>
  <text x="700" y="335" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#94A3B8">x9Wd2Lp7…Qe1=</text>

  <!-- Key facts -->
  <rect x="20" y="382" width="960" height="72" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <circle cx="40" cy="406" r="3" fill="#22C55E"/>
  <text x="52" y="410" font-size="12.5" fill="#334155">The file is encrypted and stored only once. Sharing it with a doctor only re-wraps its DEK: the file itself is never re-encrypted.</text>
  <circle cx="40" cy="430" r="3" fill="#22C55E"/>
  <text x="52" y="434" font-size="12.5" fill="#334155">The two envelopes protect the same key but share no byte: RSA-OAEP random padding hides even that they hold the same secret.</text>
</svg>
