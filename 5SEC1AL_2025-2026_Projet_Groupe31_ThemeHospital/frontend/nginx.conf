# Masque le numero de version de nginx dans les en-tetes et les pages
# d'erreur. Un attaquant qui connait la version exacte peut chercher les
# failles publiees pour celle-ci.
server_tokens off;

server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # --- En-tetes de securite -----------------------------------------
    # `always` : l'en-tete est emis meme sur les reponses d'erreur, ou
    # une page d'attaque a justement le plus de chances d'apparaitre.

    # Le navigateur refusera desormais tout HTTP en clair sur ce domaine.
    add_header Strict-Transport-Security "max-age=3600; includeSubDomains" always;

    # Interdit au navigateur de "deviner" le type d'un fichier. Sans cela,
    # un fichier servi en text/plain mais contenant du HTML pourrait etre
    # interprete comme une page.
    add_header X-Content-Type-Options "nosniff" always;

    # Ne divulgue pas l'URL visitee aux sites tiers.
    add_header Referrer-Policy "same-origin" always;

    # Anti-clickjacking. `frame-ancestors` de la CSP fait la meme chose
    # sur les navigateurs modernes ; on garde les deux.
    add_header X-Frame-Options "DENY" always;

    # --- Content-Security-Policy --------------------------------------
    #
    # La liste blanche de ce que la page a le droit de charger ET de
    # contacter. Meme si un script etranger etait injecte, le navigateur
    # refuserait de l'executer : il ne vient pas d'une origine autorisee.
    #
    #   default-src 'self'   tout vient de notre propre origine
    #   script-src  'self'   aucun script inline, aucun CDN
    #   connect-src          les SEULES destinations joignables en fetch :
    #                        notre API (8000) et Keycloak (8443)
    #   frame-ancestors none la page ne peut pas etre mise en iframe
    #   object-src   none    ni Flash, ni applet, ni plugin
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://localhost:8000 https://localhost:8443; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}