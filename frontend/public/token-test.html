<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Test du parcours OIDC</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
        button { padding: .6rem 1rem; margin: .3rem .3rem .3rem 0; font-size: 1rem; cursor: pointer; }
        pre { background: #f4f4f4; padding: 1rem; white-space: pre-wrap; word-break: break-all; }
    </style>
</head>
<body>
<h1>Test du parcours complet</h1>
<p>Origine : <strong id="org"></strong></p>

<button id="login">1. Se connecter via Keycloak</button>
<button id="call">2. Appeler /api/me</button>
<button id="clear">Effacer</button>

<pre id="log"></pre>

<script>
    const KC        = "https://localhost:8443/realms/hospital";
    const API       = "https://localhost:8000/api";
    const CLIENT_ID = "hospital-frontend";
    const REDIRECT  = location.origin + location.pathname;

    const logEl = document.getElementById("log");
    const log = m => logEl.textContent += m + "\n";
    document.getElementById("org").textContent = location.origin;

    let accessToken = null;

    const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf)))
        .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

    async function challengeFrom(verifier) {
        const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier));
        return b64url(d);
    }

    function decodePayload(token) {
        const p = token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
        return JSON.parse(atob(p + "=".repeat((4 - p.length % 4) % 4)));
    }

    // --- 1. Redirection vers Keycloak -------------------------------------
    document.getElementById("login").onclick = async () => {
        const verifier = b64url(crypto.getRandomValues(new Uint8Array(32)));
        sessionStorage.setItem("pkce_verifier", verifier);
        const url = new URL(KC + "/protocol/openid-connect/auth");
        url.searchParams.set("client_id", CLIENT_ID);
        url.searchParams.set("redirect_uri", REDIRECT);
        url.searchParams.set("response_type", "code");
        url.searchParams.set("scope", "openid");
        url.searchParams.set("code_challenge", await challengeFrom(verifier));
        url.searchParams.set("code_challenge_method", "S256");
        location.href = url.toString();
    };

    // --- 2. Echange du code contre un jeton (au retour) -------------------
    async function exchange(code) {
        const verifier = sessionStorage.getItem("pkce_verifier");
        const body = new URLSearchParams({
            grant_type: "authorization_code",
            client_id: CLIENT_ID,
            code, redirect_uri: REDIRECT, code_verifier: verifier
        });
        const r = await fetch(KC + "/protocol/openid-connect/token", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body
        });
        const data = await r.json();
        if (!data.access_token) { log("ERREUR echange : " + JSON.stringify(data)); return; }

        accessToken = data.access_token;
        const c = decodePayload(accessToken);
        log("=== JETON OBTENU ===");
        log("iss    : " + c.iss);
        log("aud    : " + JSON.stringify(c.aud));
        log("azp    : " + c.azp);
        log("sub    : " + c.sub);
        log("user   : " + c.preferred_username);
        log("groups : " + JSON.stringify(c.groups));
        log("exp    : " + new Date(c.exp * 1000).toLocaleString());
        log("");
    }

    // --- 3. Appel de l'API ------------------------------------------------
    document.getElementById("call").onclick = async () => {
        if (!accessToken) { log("Aucun jeton. Faites l'etape 1.\n"); return; }
        try {
            const r = await fetch(API + "/me", {
                headers: { Authorization: "Bearer " + accessToken }
            });
            log("=== REPONSE /api/me ===");
            log("statut : " + r.status);
            log(JSON.stringify(await r.json(), null, 2));
            log("");
        } catch (e) {
            log("ERREUR reseau : " + e.message + "\n");
        }
    };

    document.getElementById("clear").onclick = () => logEl.textContent = "";

    // Au chargement : si Keycloak nous a renvoye un code, l'echanger.
    const code = new URLSearchParams(location.search).get("code");
    if (code) {
        history.replaceState({}, "", REDIRECT);
        exchange(code);
    }
</script>
</body>
</html>
